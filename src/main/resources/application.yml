spring:
  application:
    name: orchestrator-ia
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/orchestrator}
    username: ${DATABASE_USERNAME:orchestrator}
    password: ${DATABASE_PASSWORD:orchestrator}
  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY:}
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      max-retries: 0
      chat:
        model: ${ORCHESTRATOR_MODEL:openai/gpt-4o-mini}
        temperature: ${ORCHESTRATOR_TEMPERATURE:1.0}
        max-completion-tokens: ${ORCHESTRATOR_MAX_OUTPUT_TOKENS:2000}

orchestration:
  orchestrator:
    system-prompt: ${ORCHESTRATOR_SYSTEM_PROMPT:Você é um Orquestrador. Decida se o objetivo foi alcançado e retorne uma resposta final em português do Brasil.}
